[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
  "jax>=0.4.38",
  "typing_extensions>=4.5.0",
  "equinox>=0.11.10",
  "sympy>=1.7.1",
  "sympy2jax>=0.0.8",
  "paramax>=0.0.5"
]
description = "JAX-friendly, opinionated ODE model builder."
name = "odax"
requires-python = ">=3.11"
version = "0.0.1"

[project.optional-dependencies]
dev = [
  "pre-commit",
  "pyright",
  "ruff"
]
tests = [
  "beartype",
  "diffrax",
  "pytest"
]

[tool.pyright]
include = ["odax", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=odax,beartype.beartype(conf=beartype.BeartypeConf(strategy=beartype.BeartypeStrategy.On))"
filterwarnings = ["always"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
select = ["E", "F", "I001", "UP"]
